defaults:
  image_resolution: [640, 480]
  num_questions: 50
  num_distractors: 3
  rectangular_prism_prob: 0.3
  use_gpu: true
  output_dir: output/

tasks:
  - task: 3d_folding
    difficulty: medium

  - task: 3d_shape_finding
    difficulty: medium

  - task: 3d_rotation
    difficulty: hard

  - task: 3d_combination
    difficulty: hard

  - task: 3d_projection
    difficulty: medium

